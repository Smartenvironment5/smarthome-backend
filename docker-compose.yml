services:
    db:
        image: postgres:18
        container_name: smarthome-db
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: "Dev_Password123!"
            POSTGRES_DB: smarthome
        ports:
            - "5432:5432"
        volumes:
            - smarthome-db-data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 5s
            timeout: 3s
            retries: 20
            start_period: 15s

volumes:
    smarthome-db-data:
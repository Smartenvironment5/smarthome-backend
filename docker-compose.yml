services:
    db:
        image: mcr.microsoft.com/mssql/server:2022-latest
        container_name: smarthome-db
        restart: unless-stopped
        environment:
            ACCEPT_EULA: "Y"
            MSSQL_SA_PASSWORD: "Dev_Password123!"
        ports:
            - "1433:1433"
        volumes:
            - smarthome-db-data:/var/opt/mssql
        healthcheck:
            test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
            interval: 5s
            timeout: 3s
            retries: 20
            start_period: 15s

volumes:
    smarthome-db-data: